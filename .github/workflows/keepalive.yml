name: Keep Backend Awake

# Render 무료 플랜은 15분간 요청이 없으면 절전 모드로 들어가
# 다음 접속 시 깨어나는 데 30~60초가 걸린다. 활동 시간대(한국 07~01시)에
# 10분마다 health 엔드포인트를 호출해 서버를 깨어 있게 유지한다.
# (새벽 02~06시 KST = 17~21 UTC 는 호출하지 않아 무료 인스턴스 시간을 아낀다.)

on:
  schedule:
    - cron: '*/10 0-16,22-23 * * *'   # UTC. 한국시간 07:00~01:50 사이 10분마다
  workflow_dispatch:                   # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
              https://portfolio-dashboard-e9qc.onrender.com/api/health || echo "000")
            echo "시도 $i → HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "health 응답 실패 (서버 깨어나는 중일 수 있음)"
